# Gradius III (USA) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $8000, native NMI $8223 (from the cartridge header).

func WaitVBlank 86CD exit_mx:0,0
hle_func 86CD HleWaitVBlank

# >>> BEGIN symbols.toml (generated — do not edit)
symbol 008000 I_RESET
force_lle 008000
symbol 008223 I_NMI
force_lle 008223
# <<< END symbols.toml
